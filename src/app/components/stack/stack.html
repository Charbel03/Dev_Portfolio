<section id="stack" data-section class="stack section-alt">
  <div class="wrap">
    <div data-reveal="0" class="head">
      <div>
        <div class="eyebrow">// 03 — stack.json</div>
        <h2 class="h2"><span data-sv>Tekniska färdigheter</span><span data-en>Technical skills</span></h2>
      </div>
      <ul class="legend">
        @for (item of legend; track item.key) {
          <li><span class="dot {{ item.key }}"></span><span data-sv>{{ item.sv }}</span><span data-en>{{ item.en }}</span></li>
        }
      </ul>
    </div>

    <div data-reveal="80" class="tabs">
      @for (tab of tabs; track tab.key) {
        <button type="button" [class.active]="filter() === tab.key" (click)="filter.set(tab.key)">
          <span data-sv>{{ tab.sv }}</span><span data-en>{{ tab.en }}</span>
        </button>
      }
    </div>

    <div data-reveal="160" class="chips">
      @for (skill of skills; track skill.name) {
        <div class="chip" [class.off]="!isOn(skill)" [class.picked]="isOn(skill) && filter() !== 'all'">
          @if (skill.src) {
            <span class="dots">@for (s of skill.src; track s) { <span class="dot {{ s }}"></span> }</span>
          }
          {{ skill.name }}
        </div>
      }
    </div>
  </div>
</section>
