<section id="projekt" data-section class="projects section-alt">
  <div class="wrap">
    <div data-reveal="0" class="head">
      <div class="eyebrow">// 05 — projects/</div>
      <h2 class="h2"><span data-sv>Projekt</span><span data-en>Projects</span></h2>
    </div>

    <div class="list">
      @for (project of projects; track project.id; let i = $index) {
        <div data-reveal="0">
          <app-project-card [project]="project" [index]="i" [reverse]="i % 2 === 1" />
        </div>
      }
    </div>
  </div>
</section>
